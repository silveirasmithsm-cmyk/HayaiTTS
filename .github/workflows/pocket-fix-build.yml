name: Pocket custom voice cloning build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/custom-pocket-cloning

permissions:
  contents: read

concurrency:
  group: pocket-custom-cloning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and verify ARMv7 debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify ARMv7 APK signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*armeabi-v7a*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No armeabi-v7a APK was produced."
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          fi
          echo "Selected APK: $APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/armv7-sha256.txt
          echo "APK_BYTES=$(stat -c%s "$APK")" | tee app/build/outputs/apk/debug/armv7-size.txt

      - name: Upload ARMv7 APK only
        uses: actions/upload-artifact@v4
        with:
          name: hayaitts-pocket-fix-armv7-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*armeabi-v7a*.apk
            app/build/outputs/apk/debug/armv7-sha256.txt
            app/build/outputs/apk/debug/armv7-size.txt
          if-no-files-found: error
          retention-days: 14
