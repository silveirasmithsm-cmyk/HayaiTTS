name: Compare APK signing certificates

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install apksigner
        run: sdkmanager "build-tools;36.0.0"

      - name: Download previous and current build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45055684263 --repo "${GITHUB_REPOSITORY}" --name "hayaitts-pocket-fix-debug-588685bd0a11e3f39bc8ac59296569aa8ad3655c" --dir old
          gh run download 45072075611 --repo "${GITHUB_REPOSITORY}" --name "hayaitts-pocket-fix-armv7-8c5ec34c5f63297a1d16c98227a46aee71bb1226" --dir new
          OLD_APK="$(find old -type f -name '*.apk' | head -n 1)"
          NEW_APK="$(find new -type f -name '*.apk' | head -n 1)"
          test -n "$OLD_APK"
          test -n "$NEW_APK"
          echo "OLD_APK=$OLD_APK" >> "$GITHUB_ENV"
          echo "NEW_APK=$NEW_APK" >> "$GITHUB_ENV"
          echo "Previous APK: $OLD_APK"
          echo "Current APK: $NEW_APK"

      - name: Verify and compare signing certificates
        id: compare
        run: |
          set -euo pipefail
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs "$OLD_APK" | tee old-cert.txt
          "$apksigner" verify --print-certs "$NEW_APK" | tee new-cert.txt
          OLD_FP="$(sed -n 's/.*certificate SHA-256 digest: //p' old-cert.txt | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          NEW_FP="$(sed -n 's/.*certificate SHA-256 digest: //p' new-cert.txt | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "OLD_SHA256=$OLD_FP" >> "$GITHUB_OUTPUT"
          echo "NEW_SHA256=$NEW_FP" >> "$GITHUB_OUTPUT"
          echo "OLD_SHA256=$OLD_FP"
          echo "NEW_SHA256=$NEW_FP"
          test -n "$OLD_FP"
          test -n "$NEW_FP"
          if [ "$OLD_FP" = "$NEW_FP" ]; then
            echo "RESULT=MATCH" >> "$GITHUB_OUTPUT"
            echo "SIGNATURE_RESULT=MATCH" >> "$GITHUB_ENV"
          else
            echo "RESULT=MISMATCH" >> "$GITHUB_OUTPUT"
            echo "SIGNATURE_RESULT=MISMATCH" >> "$GITHUB_ENV"
          fi

      - name: Publish comparison result
        if: always()
        run: |
          {
            echo "## APK signature comparison"
            echo ""
            echo "Previous certificate: ${{ steps.compare.outputs.OLD_SHA256 }}"
            echo ""
            echo "Current certificate: ${{ steps.compare.outputs.NEW_SHA256 }}"
            echo ""
            echo "Result: ${{ steps.compare.outputs.RESULT }}"
          } >> "$GITHUB_STEP_SUMMARY"
